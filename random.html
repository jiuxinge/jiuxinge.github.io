<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯一标识符生成器与随机一言获取器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        .input-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* 新增的样式 */
        .combined {
            display: flex;
            flex-direction: column;
        }
        .combined input {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>唯一标识符生成器与随机一言获取器</h1>
        <div class="combined"> <!-- 新增一个段落包含所有内容 -->
            <button onclick="generateUUID()">生成UUID</button>
            <button onclick="copyToClipboard('uuid-display')">复制</button>
            <input type="text" id="uuid-display" readonly>
            
            <button onclick="getHitokoto()">获取随机一言</button>
            <button onclick="copyToClipboard('hitokoto-text')">复制</button>
            <input type="text" id="hitokoto-text" readonly>
            
            <div id="hitokoto-details" class="hitokoto-details"></div>
        </div>
    </div>

    <script>
        async function generateUUID() {
            try {
                const response = await fetch('https://www.uuidgenerator.net/api/version4');
                const uuid = await response.text();
                document.getElementById('uuid-display').value = uuid;
            } catch (error) {
                console.error('生成UUID时出错:', error);
            }
        }

        function getHitokoto() {
            fetch('https://v1.hitokoto.cn/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('hitokoto-text').value = '一言：' + data.hitokoto;
                    document.getElementById('hitokoto-details').innerHTML = `
                        <p>来源: ${data.from}</p>
                        <p>作者: ${data.from_who}</p>
                        <p>创建者: ${data.creator}</p>
                        <p>ID: ${data.id}</p>
                        <p>UUID: ${data.uuid}</p>
                        <p>长度: ${data.length}</p>
                    `;
                })
                .catch(error => console.error('Error fetching hitokoto:', error));
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const textarea = document.createElement('textarea');
                textarea.value = element.value;
                textarea.style.position = 'fixed';  // 防止出现滚动条
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        alert('已复制到剪贴板');
                    } else {
                        alert('复制失败');
                    }
                } catch (err) {
                    console.error('无法复制', err);
                }
                document.body.removeChild(textarea);
            } else {
                console.error('无法找到元素');
            }
        }
    </script>
</body>
</html>
