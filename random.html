<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯一标识符生成器与随机一言获取器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        #uuids {
            margin-top: 20px;
        }
        .uuid-container {
            margin-bottom: 10px;
        }
        #hitokoto {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>唯一标识符生成器与随机一言获取器</h1>
        <div>
            <button onclick="generateUUIDs()">生成三个UUID</button>
            <div id="uuids">
                <!-- UUIDs will be inserted here -->
            </div>
        </div>
        <div>
            <button onclick="getHitokoto()">获取随机一言</button>
            <button class="copy-button" onclick="copyToClipboard('hitokoto')">复制</button>
            <div id="hitokoto" class="hitokoto-container"></div>
        </div>
    </div>

    <script>
        function generateUUIDs() {
            const uuidsContainer = document.getElementById('uuids');
            uuidsContainer.innerHTML = ''; // Clear previous UUIDs
            for (let i = 0; i < 3; i++) {
                const uuid = crypto.randomUUID();
                const uuidDiv = document.createElement('div');
                uuidDiv.className = 'uuid-container';
                uuidDiv.innerHTML = `
                    <p>UUID: ${uuid}</p>
                    <button class="copy-button" onclick="copyToClipboard(this)">复制</button>
                `;
                uuidsContainer.appendChild(uuidDiv);
            }
        }

        function getHitokoto() {
            fetch('https://v1.hitokoto.cn/')
                .then(response => response.json())
                .then(data => {
                    const hitokotoElement = document.getElementById('hitokoto');
                    hitokotoElement.innerHTML = `
                        <p>一言: ${data.hitokoto}</p>
                        <p>来源: ${data.from}</p>
                        <p>作者: ${data.from_who}</p>
                        <p>创建者: ${data.creator}</p>
                        <p>ID: ${data.id}</p>
                        <p>UUID: ${data.uuid}</p>
                        <p>长度: ${data.length}</p>
                    `;
                })
                .catch(error => console.error('Error fetching hitokoto:', error));
        }

        function copyToClipboard(element) {
            if (element.tagName === 'BUTTON') {
                const uuidDiv = element.parentNode;
                const textToCopy = uuidDiv.querySelector('p').textContent;
                copyTextToClipboard(textToCopy);
            } else if (element.id === 'hitokoto') {
                const textToCopy = document.getElementById('hitokoto').innerText;
                copyTextToClipboard(textToCopy);
            }
        }

        function copyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert('已复制到剪贴板');
                } else {
                    alert('复制失败');
                }
            } catch (err) {
                console.error('无法复制', err);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
